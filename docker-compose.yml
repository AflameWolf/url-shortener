services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # прикрепляем локальные пути к путям в контейнере
      - ./src:/var/www/laravel
    depends_on:
      - mysql
      - php
  php:
    build:
      context: dockerfiles
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/laravel

  mysql:
    image: "mysql:8.0"
    ports:
      - "3316:3306" # перекидываем бд на другой порт что-бы не пинать локальную
    env_file: # ссылка на env файл с настройками
      - ./env/mysql.env
    volumes:
      - ./db:/var/lib/mysql

  composer:
    build:
      context: dockerfiles
      dockerfile: composer.dockerfile
    volumes:
      - ./src:/var/www/laravel # запуск docker-compose run composer create-project laravel/laravel .
    # в контейнере создастся проект в папке /var/www/laravel который отразиться на нашу локальную папку src,
    #а она в свою очередь отразит свое содержимое на папки /var/www/laravel в других контейнерах
  artisan:
    build:
      context: dockerfiles
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/laravel
    entrypoint: ["php", "/var/www/laravel/artisan"]

  node:
    image: "node:22-alpine"
    user: "node"
    working_dir: /var/www/laravel
    volumes:
      - ./src:/var/www/laravel
    entrypoint: [ "npm" ]